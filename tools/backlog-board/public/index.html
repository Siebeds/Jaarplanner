<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backlogbord · Jaarplanner</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>Backlogbord</h1>
        <p id="meta" class="meta">Verbinden…</p>
      </div>
      <div class="controls">
        <div class="segmented" role="group" aria-label="Soort tickets">
          <button type="button" data-kind="alle" aria-pressed="true">Alle</button>
          <button type="button" data-kind="FB" aria-pressed="false"><span class="swatch fb" aria-hidden="true"></span>Functioneel</button>
          <button type="button" data-kind="TB" aria-pressed="false"><span class="swatch tb" aria-hidden="true"></span>Technisch</button>
        </div>
        <label class="search">
          <span class="sr">Zoeken</span>
          <input id="q" type="search" placeholder="Zoek op titel, id of sessie" autocomplete="off" />
        </label>
      </div>
    </header>
    <div class="toolbar">
      <div class="segmented" role="group" aria-label="Weergave">
        <button type="button" data-view="bord" aria-pressed="true">Bord</button>
        <button type="button" data-view="tabel" aria-pressed="false">Tabel</button>
      </div>
      <label class="pick">
        <span>Prioriteit</span>
        <select id="prio">
          <option value="alle">Alle</option>
          <option value="hoog">Hoog</option>
          <option value="middel">Middel</option>
          <option value="laag">Laag</option>
        </select>
      </label>
      <label class="pick">
        <span>Aangemaakt</span>
        <select id="created"></select>
      </label>
      <label class="pick">
        <span>Sorteer op</span>
        <select id="sort"></select>
      </label>
      <button type="button" id="reset" class="reset" hidden>Wis filters</button>
      <p id="result" class="result" aria-live="polite"></p>
    </div>
    <main>
      <p id="error" class="load-error" role="alert" hidden></p>
      <section id="invalid" class="invalid" hidden></section>
      <div id="board" class="board"></div>
      <div id="table" class="table-wrap" hidden></div>
    </main>
    <dialog id="detail" aria-labelledby="detail-title">
      <div id="drawer" class="drawer"></div>
    </dialog>
  </body>
</html>
