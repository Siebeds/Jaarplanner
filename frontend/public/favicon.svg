<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Jaarplanner">
  <!--
    The mark is the thing this tool is about: a school year as a ribbon of UNEQUAL periods, broken by a
    vacation. Deliberately not a calendar-page or a checkmark glyph — a uniform month grid is the one
    thing ADR-0013 and the approved E3-10 wireframe refuse, so the icon should not draw one either.
    Ink only, no accent: colour in this product means doelsoort/dekking/status (Art. XII), never chrome.
  -->
  <rect width="32" height="32" rx="6" fill="#0f172a" />
  <g fill="#ffffff">
    <rect x="6" y="9" width="7" height="14" rx="1.5" />
    <rect x="15" y="9" width="4" height="14" rx="1.5" />
    <!-- the gap between 19 and 22 is the vakantie: a period never runs through it -->
    <rect x="22" y="9" width="4" height="14" rx="1.5" />
  </g>
</svg>
