<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/merk.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f8" />
    <title>Jaarplanner</title>
    <!-- Runs before the first paint, so a teacher who chose a theme in this browser never sees the
         other one flash first. Only an explicit choice is read: "zoals het toestel" needs no script,
         the stylesheet's media query answers it. The key and shape belong to src/state/weergave.ts,
         and weergave.test.ts pins them. -->
    <script>
      try {
        var bewaard = JSON.parse(localStorage.getItem("jaarplanner-weergave") || "null");
        var keuze = bewaard && bewaard.state && bewaard.state.keuze;
        if (keuze === "licht" || keuze === "donker") document.documentElement.setAttribute("data-weergave", keuze);
      } catch (e) {}
    </script>
    <!-- Hides the tussenpagina below until the stylesheet has arrived, which defines the variable. -->
    <style>
      .tussenpagina {
        visibility: var(--tussenpagina-zichtbaar, hidden);
      }
    </style>
  </head>
  <body>
    <!-- The tussenpagina (TB-026), for the moment before the script has loaded. React replaces it with the
         same drawing from src/app/Tussenpagina.tsx: change one, change the other. The status line is
         empty here on purpose; its sentence lives in the catalogue. -->
    <div id="root">
      <main class="tussenpagina">
        <h1 class="tussenpagina-naam">Jaarplanner</h1>
        <span aria-hidden="true" class="tussenpagina-balk"><span></span><span></span><span></span></span>
        <p class="tussenpagina-status"></p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
