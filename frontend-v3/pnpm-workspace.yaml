# Approve esbuild (Vite's native bundler dependency) to run its install script.
# pnpm 11 blocks dependency build scripts by default; esbuild needs its
# postinstall to place the platform binary used by `vite build` / `vite dev`.
allowBuilds:
  esbuild: true

# Retained for older pnpm versions / tooling that read the pnpm 10 key.
onlyBuiltDependencies:
  - esbuild

# See .npmrc: a bare `pnpm` is not on PATH here.
verifyDepsBeforeRun: false
